[project]
name = "mdtools"
version = "0.1.0"
description = "Desktop workbench for MiniDisc: design disc labels and J-card inserts for Cricut cutting and printing, record albums from foobar2000 or straight from a CD, and title discs over infrared"
requires-python = ">=3.11"
dependencies = [
    "PySide6>=6.7",
    "Pillow>=10.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-qt>=4.4",
    "pyinstaller>=6.0",
]

[project.scripts]
mdtools = "mdtools.main:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"mdtools.templates" = ["defaults.json"]
"mdtools.i18n" = ["*.qm"]

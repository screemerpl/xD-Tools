[project]
name = "mdtools"
version = "0.3.3"
description = "Desktop workbench for MiniDisc, CD-R and compact cassette: design disc labels, J-cards, case inserts and shell labels for Cricut cutting and printing, record albums from a CD or a folder of files, burn audio CD-Rs with CD-Text, record cassettes side by side, and title MiniDiscs over infrared"
license = { text = "GPL-3.0-or-later" }
classifiers = [
    "License :: OSI Approved :: GNU General Public License v3 or later (GPLv3+)",
]
requires-python = ">=3.11"
dependencies = [
    "PySide6>=6.7",
    "Pillow>=10.0",
    "telethon>=1.34",
    "mutagen>=1.47",
    "soxr>=0.5",
    "sounddevice>=0.4",
    "soundfile>=0.12",
    "numpy>=1.24",
    "numba>=0.59",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-qt>=4.4",
    "pyinstaller>=6.0",
]

[project.scripts]
mdtools = "mdtools.main:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"mdtools.templates" = ["defaults.json"]
"mdtools.i18n" = ["*.qm"]
